document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"7f80e5f3-4b91-4190-a33c-7ca4eb31ce9b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --bg:#F6F2EA; --surface:#ffffff; --surface-soft:#ECE7DB;\n    --ink:#28352F; --ink-soft:#5E6E67;\n    --teal:#4E8478; --teal-deep:#203A35; --teal-pale:#DDE7E1;\n    --line:rgba(40,53,47,0.10); --wa:#25D366;\n  }\n  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}\n  html{scroll-behavior:smooth;}\n  body{background:var(--bg);color:var(--ink);font-family:'Heebo',sans-serif;font-weight:300;direction:rtl;line-height:1.8;font-size:17px;-webkit-font-smoothing:antialiased;}\n  body.high-contrast{background:#000 !important;color:#fff !important;}\n  body.high-contrast [data-tone=\"light\"]{background:#000 !important;}\n  body.high-contrast [data-tone=\"dark\"]{background:#0b0b0b !important;}\n  body.high-contrast [data-tone=\"card\"]{background:#121212 !important;border-color:#fff !important;}\n  body.high-contrast h1,body.high-contrast h2,body.high-contrast h3,body.high-contrast em,body.high-contrast strong,body.high-contrast p,body.high-contrast li,body.high-contrast span{color:#fff !important;}\n  body.large-text{font-size:21px;}\n  body.large-text h1{font-size:clamp(2.6rem,6vw,3.7rem);}\n  body.large-text h2{font-size:clamp(1.9rem,4.5vw,2.4rem);}\n  body.dyslexia-font, body.dyslexia-font *{font-family:Arial,Helvetica,sans-serif !important;letter-spacing:0.04em;word-spacing:0.12em;}\n  [data-a11y-opt][aria-pressed=\"true\"]{background:var(--teal) !important;border-color:var(--teal) !important;color:#fff !important;}\n  :focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:4px;}\n  @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none !important;animation:none !important;}}\n  @media (max-width:640px){\n    [data-r=\"hero\"]{grid-template-columns:1fr !important;}\n    [data-r=\"hero-photo\"]{order:-1;width:220px !important;margin-inline:auto;}\n    [data-r=\"details\"]{grid-template-columns:1fr !important;}\n    [data-r=\"about\"]{grid-template-columns:1fr !important;}\n  }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<!-- HEADER -->\n<header data-tone=\"light\" style=\"position:sticky;top:0;z-index:100;background:rgba(246,242,234,0.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:13px 0;\">\n  <div style=\"max-width:720px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;\">\n    <div style=\"line-height:1.25;\">\n      <div style=\"font-family:'Frank Ruhl Libre',serif;color:var(--teal);font-size:1.1rem;font-weight:500;\">דוד אינגבר<\u002Fdiv>\n      <div style=\"color:var(--ink-soft);font-size:0.8rem;\">טיפול ואימון רגשי<\u002Fdiv>\n    <\u002Fdiv>\n    <a href=\"https://wa.me/972559930227?text=נשימה\" target=\"_blank\" rel=\"noopener\" style=\"background:var(--teal);color:#fff;padding:9px 22px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;transition:background .2s;\" style-hover=\"background:var(--teal-deep)\">דברו איתי בוואטסאפ<\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- HERO -->\n<section data-tone=\"light\" data-screen-label=\"Hero\" aria-labelledby=\"hero-heading\" style=\"position:relative;overflow:hidden;padding:74px 0 66px;background:radial-gradient(115% 85% at 88% 0%, var(--teal-pale) 0%, transparent 52%), var(--bg);\">\n  <div style=\"max-width:720px;margin:0 auto;padding:0 24px;\">\n    <div style=\"display:flex;align-items:center;gap:12px;color:var(--teal);font-size:13px;letter-spacing:0.1em;font-weight:500;margin-bottom:26px;\">\n      <span style=\"width:30px;height:2px;background:var(--teal);border-radius:2px;display:inline-block;\"><\u002Fspan>\n      סדנה חווייתית · טראנס, גוף ותודעה\n    <\u002Fdiv>\n    <div data-r=\"hero\" style=\"display:grid;grid-template-columns:1fr auto;gap:46px;align-items:center;\">\n      <div>\n        <h1 id=\"hero-heading\" style=\"font-family:'Frank Ruhl Libre',serif;font-weight:500;font-size:clamp(2.2rem,5.5vw,3.3rem);line-height:1.22;color:var(--ink);margin-bottom:24px;\">\n          הבנת הכל —<br>וזה עדיין<br><em style=\"font-style:normal;color:var(--teal);\">לא השתנה?<\u002Fem>\n        <\u002Fh1>\n        <p style=\"color:var(--ink-soft);font-size:1.12rem;line-height:1.85;max-width:470px;margin-bottom:34px;\">\n          ניסית. הבנת. ודיברת על זה.<br>ועדיין — כשמגיע הטריגר — הגוף לוקח פיקוד.<br><strong style=\"color:var(--ink);font-weight:500;\">יש דרך אחרת לגמרי.<\u002Fstrong>\n        <\u002Fp>\n        <a href=\"https://wa.me/972559930227?text=נשימה\" target=\"_blank\" rel=\"noopener\" aria-label=\"שלח הודעת וואטסאפ עם המילה נשימה\" style=\"display:inline-flex;align-items:center;gap:10px;background:var(--wa);color:#fff;padding:15px 28px;border-radius:999px;text-decoration:none;font-size:16px;font-weight:600;box-shadow:0 10px 26px rgba(37,211,102,0.26);transition:transform .15s, box-shadow .2s;\" style-hover=\"transform:translateY(-2px);box-shadow:0 14px 32px rgba(37,211,102,0.34)\">\n          <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z\"><\u002Fpath><path d=\"M12 0C5.373 0 0 5.373 0 12c0 2.091.537 4.06 1.476 5.778L.057 23.25l5.616-1.473A11.953 11.953 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.808 9.808 0 01-5.002-1.368l-.359-.213-3.73.977.996-3.638-.234-.374A9.815 9.815 0 012.182 12C2.182 6.59 6.59 2.182 12 2.182S21.818 6.59 21.818 12 17.41 21.818 12 21.818z\"><\u002Fpath><\u002Fsvg>\n          שלח/י \"נשימה\" ואחזור אליך\n        <\u002Fa>\n      <\u002Fdiv>\n      <div data-r=\"hero-photo\" aria-hidden=\"true\" style=\"position:relative;flex-shrink:0;width:200px;\">\n        <img src=\"3c085db1-3644-4f8b-83b8-e83d6cefed57\" alt=\"\" style=\"width:200px;height:250px;object-fit:cover;border-radius:18px;display:block;position:relative;z-index:1;box-shadow:0 18px 42px rgba(32,58,53,0.18);\">\n        <span aria-hidden=\"true\" style=\"position:absolute;bottom:-10px;right:-10px;width:100%;height:100%;border:2px solid var(--teal);border-radius:18px;opacity:0.35;pointer-events:none;\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- WHY -->\n<section data-tone=\"light\" data-screen-label=\"Why\" aria-labelledby=\"why-heading\" style=\"padding:62px 0;border-top:1px solid var(--line);\">\n  <div style=\"max-width:720px;margin:0 auto;padding:0 24px;\">\n    <div style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-bottom:14px;\">מה קורה כאן בעצם<\u002Fdiv>\n    <h2 id=\"why-heading\" style=\"font-family:'Frank Ruhl Libre',serif;font-size:clamp(1.6rem,3.6vw,2.1rem);font-weight:500;color:var(--ink);line-height:1.35;margin-bottom:20px;\">את/ה לא נכשל/ת. את/ה מגיב/ה ממערכת מוצפת.<\u002Fh2>\n    <div style=\"border-right:3px solid var(--teal);padding-right:20px;margin:22px 0;color:var(--ink-soft);font-size:1.05rem;line-height:1.9;\">כשאת/ה מוצף/ת — את/ה כולך בתוך הבעיה.<br>ואי אפשר לפתור בעיה מתוך החלק שחווה אותה.<\u002Fdiv>\n    <p style=\"margin-bottom:16px;\">רוב השיטות מנסות לדבר על זה, לנתח, להיכנס פנימה שוב ושוב. אבל כשהמערכת עצמה מוצפת — אין בתוכה מקום שמסוגל לשנות אותה.<\u002Fp>\n    <p style=\"margin:0;\"><strong style=\"font-weight:500;color:var(--ink);\">אני לא צולל איתך לתוך הכאב. אני קודם מוציא אותך ממנו — ורק אז, מתוך יציבות, מסתכלים יחד.<\u002Fstrong><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- STEPS -->\n<section data-tone=\"light\" data-screen-label=\"Process\" aria-labelledby=\"process-heading\" style=\"padding:62px 0;border-top:1px solid var(--line);\">\n  <div style=\"max-width:720px;margin:0 auto;padding:0 24px;\">\n    <div style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-bottom:14px;\">מה קורה בסדנה<\u002Fdiv>\n    <h2 id=\"process-heading\" style=\"font-family:'Frank Ruhl Libre',serif;font-size:clamp(1.6rem,3.6vw,2.1rem);font-weight:500;color:var(--ink);line-height:1.35;margin-bottom:8px;\">ארבעה שלבים שהגוף זוכר<\u002Fh2>\n    <div role=\"list\" style=\"display:flex;flex-direction:column;gap:16px;margin-top:28px;\">\n      <div role=\"listitem\" data-tone=\"card\" style=\"display:grid;grid-template-columns:54px 1fr;gap:18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:0 5px 20px rgba(32,58,53,0.04);\">\n        <div aria-hidden=\"true\" style=\"width:54px;height:54px;border-radius:50%;background:var(--teal-pale);color:var(--teal);font-family:'Frank Ruhl Libre',serif;font-size:1.35rem;font-weight:600;display:flex;align-items:center;justify-content:center;\">א<\u002Fdiv>\n        <div><h3 style=\"font-family:'Frank Ruhl Libre',serif;font-size:1.18rem;color:var(--ink);font-weight:500;margin-bottom:6px;\">הכאב מקבל צורה<\u002Fh3><p style=\"color:var(--ink-soft);font-size:1rem;margin:0;\">לוקחים את מה שמציף ונותנים לו גודל ומיקום. הוא מפסיק להיות \"כל מי שאת/ה\" והופך למשהו שיש לך.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div role=\"listitem\" data-tone=\"card\" style=\"display:grid;grid-template-columns:54px 1fr;gap:18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:0 5px 20px rgba(32,58,53,0.04);\">\n        <div aria-hidden=\"true\" style=\"width:54px;height:54px;border-radius:50%;background:var(--teal-pale);color:var(--teal);font-family:'Frank Ruhl Libre',serif;font-size:1.35rem;font-weight:600;display:flex;align-items:center;justify-content:center;\">ב<\u002Fdiv>\n        <div><h3 style=\"font-family:'Frank Ruhl Libre',serif;font-size:1.18rem;color:var(--ink);font-weight:500;margin-bottom:6px;\">יציאה מהביצה דרך טראנס<\u002Fh3><p style=\"color:var(--ink-soft);font-size:1rem;margin:0;\">דרך עבודה חווייתית עמוקה, משחררים עומס מהמערכת העצבית — לא דרך מחשבה, דרך חוויה.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div role=\"listitem\" data-tone=\"card\" style=\"display:grid;grid-template-columns:54px 1fr;gap:18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:0 5px 20px rgba(32,58,53,0.04);\">\n        <div aria-hidden=\"true\" style=\"width:54px;height:54px;border-radius:50%;background:var(--teal-pale);color:var(--teal);font-family:'Frank Ruhl Libre',serif;font-size:1.35rem;font-weight:600;display:flex;align-items:center;justify-content:center;\">ג<\u002Fdiv>\n        <div><h3 style=\"font-family:'Frank Ruhl Libre',serif;font-size:1.18rem;color:var(--ink);font-weight:500;margin-bottom:6px;\">מפגש עם עצמך<\u002Fh3><p style=\"color:var(--ink-soft);font-size:1rem;margin:0;\">מתוך שקט יחסי נוצר רגע נדיר: יש בך מקום שהבעיה אף פעם לא נגעה בו. לא תיאוריה — חוויה גופנית.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div role=\"listitem\" data-tone=\"card\" style=\"display:grid;grid-template-columns:54px 1fr;gap:18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:0 5px 20px rgba(32,58,53,0.04);\">\n        <div aria-hidden=\"true\" style=\"width:54px;height:54px;border-radius:50%;background:var(--teal-pale);color:var(--teal);font-family:'Frank Ruhl Libre',serif;font-size:1.35rem;font-weight:600;display:flex;align-items:center;justify-content:center;\">ד<\u002Fdiv>\n        <div><h3 style=\"font-family:'Frank Ruhl Libre',serif;font-size:1.18rem;color:var(--ink);font-weight:500;margin-bottom:6px;\">שינוי היחסים עם הכאב<\u002Fh3><p style=\"color:var(--ink-soft);font-size:1rem;margin:0;\">לא \"לתקן\" אותך — אלא לשנות את היחסים שלך עם זה, כך שזה מפסיק לנהל אותך.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- TESTIMONIALS -->\n<section data-tone=\"light\" data-screen-label=\"Testimonials\" aria-labelledby=\"testimonials-heading\" style=\"padding:62px 0;border-top:1px solid var(--line);\">\n  <div style=\"max-width:720px;margin:0 auto;padding:0 24px;\">\n    <div style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-bottom:14px;\">מה אומרים אנשים שהיו בסדנה<\u002Fdiv>\n    <h2 id=\"testimonials-heading\" style=\"font-family:'Frank Ruhl Libre',serif;font-size:clamp(1.6rem,3.6vw,2.1rem);font-weight:500;color:var(--ink);line-height:1.35;margin-bottom:20px;\">חוויה שהגוף זוכר<\u002Fh2>\n    <div style=\"position:relative;border-radius:18px;overflow:hidden;max-height:300px;margin-bottom:24px;box-shadow:0 10px 30px rgba(32,58,53,0.10);\">\n      <img src=\"6d3c5f27-94e4-4bd4-b565-1300d017ed10\" alt=\"רגע של שקט מתוך סדנה קודמת — משתתפים שוכבים במרחב מואר\" style=\"width:100%;display:block;object-fit:cover;object-position:center bottom;max-height:340px;\">\n      <div aria-hidden=\"true\" style=\"position:absolute;inset:0;background:linear-gradient(to top, rgba(20,40,36,0.45) 0%, transparent 58%);\"><\u002Fdiv>\n      <span style=\"position:absolute;bottom:14px;right:18px;color:rgba(255,255,255,0.85);font-size:13px;letter-spacing:0.04em;\">מתוך סדנה קודמת<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px;\">\n      <blockquote data-tone=\"card\" style=\"background:var(--surface);border:1px solid var(--line);border-right:3px solid var(--teal);border-radius:14px;padding:20px 24px;margin:0;font-size:1.02rem;color:var(--ink);line-height:1.8;\">הרגשתי פתאום שאני יכול להסתכל על עצמי מבחוץ בלי לשקוע.<\u002Fblockquote>\n      <blockquote data-tone=\"card\" style=\"background:var(--surface);border:1px solid var(--line);border-right:3px solid var(--teal);border-radius:14px;padding:20px 24px;margin:0;font-size:1.02rem;color:var(--ink);line-height:1.8;\">יצאתי עם תחושת תקווה אמיתית בגוף, לא רק בראש.<\u002Fblockquote>\n      <blockquote data-tone=\"card\" style=\"background:var(--surface);border:1px solid var(--line);border-right:3px solid var(--teal);border-radius:14px;padding:20px 24px;margin:0;font-size:1.02rem;color:var(--ink);line-height:1.8;\">הייתה לי חוויה של שחרור דרך הגוף — לא דרך מחשבה.<\u002Fblockquote>\n      <blockquote data-tone=\"card\" style=\"background:var(--surface);border:1px solid var(--line);border-right:3px solid var(--teal);border-radius:14px;padding:20px 24px;margin:0;font-size:1.02rem;color:var(--ink);line-height:1.8;\">זה נתן לי רגע של שקט שלא חוויתי הרבה זמן.<\u002Fblockquote>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOR WHOM -->\n<section data-tone=\"light\" data-screen-label=\"ForWhom\" aria-labelledby=\"whom-heading\" style=\"padding:62px 0;border-top:1px solid var(--line);\">\n  <div style=\"max-width:720px;margin:0 auto;padding:0 24px;\">\n    <div style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-bottom:14px;\">למי זה מתאים<\u002Fdiv>\n    <h2 id=\"whom-heading\" style=\"font-family:'Frank Ruhl Libre',serif;font-size:clamp(1.6rem,3.6vw,2.1rem);font-weight:500;color:var(--ink);line-height:1.35;margin-bottom:8px;\">זה מתאים לך אם…<\u002Fh2>\n    <ul role=\"list\" style=\"list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:14px;\">\n      <li style=\"display:flex;align-items:flex-start;gap:13px;font-size:1.02rem;color:var(--ink);\"><span aria-hidden=\"true\" style=\"flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--teal-pale);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:3px;\">✓<\u002Fspan>את/ה מבין/ה הכל בראש — אבל הגוף לא משתנה<\u002Fli>\n      <li style=\"display:flex;align-items:flex-start;gap:13px;font-size:1.02rem;color:var(--ink);\"><span aria-hidden=\"true\" style=\"flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--teal-pale);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:3px;\">✓<\u002Fspan>דיברת על זה מספיק — ומחפש/ת חוויה אחרת<\u002Fli>\n      <li style=\"display:flex;align-items:flex-start;gap:13px;font-size:1.02rem;color:var(--ink);\"><span aria-hidden=\"true\" style=\"flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--teal-pale);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:3px;\">✓<\u002Fspan>את/ה רוצה להרגיש שינוי, לא רק להבין אותו<\u002Fli>\n      <li style=\"display:flex;align-items:flex-start;gap:13px;font-size:1.02rem;color:var(--ink);\"><span aria-hidden=\"true\" style=\"flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--teal-pale);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:3px;\">✓<\u002Fspan>את/ה מוכן/ה לנסות גישה אחרת ממה שעשית עד היום<\u002Fli>\n    <\u002Ful>\n    <div role=\"note\" style=\"margin-top:24px;padding:16px 20px;background:var(--surface-soft);border-radius:12px;font-size:0.95rem;color:var(--ink-soft);\"><strong style=\"color:var(--ink);font-weight:500;\">פחות מתאים<\u002Fstrong> למי שמחפש שיחה טיפולית קלאסית או כלים קוגניטיביים בלבד.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- DETAILS -->\n<section data-tone=\"light\" data-screen-label=\"Details\" aria-labelledby=\"details-heading\" style=\"padding:62px 0;border-top:1px solid var(--line);\">\n  <div style=\"max-width:720px;margin:0 auto;padding:0 24px;\">\n    <div data-tone=\"dark\" style=\"background:var(--teal-deep);border-radius:20px;padding:38px 34px;color:#fff;position:relative;overflow:hidden;\">\n      <div style=\"font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--teal-pale);font-weight:600;margin-bottom:12px;\">פרטי הסדנה<\u002Fdiv>\n      <h2 id=\"details-heading\" style=\"font-family:'Frank Ruhl Libre',serif;font-size:clamp(1.6rem,3.6vw,2rem);font-weight:500;color:#fff;line-height:1.35;margin-bottom:26px;\">סדנת שחרור עומס רגשי<\u002Fh2>\n      <div data-r=\"details\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px 20px;margin-bottom:30px;\">\n        <div><span style=\"display:block;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:3px;\">מיקום<\u002Fspan><span style=\"font-size:1.02rem;color:#fff;\">רמת החייל, תל אביב<\u002Fspan><\u002Fdiv>\n        <div><span style=\"display:block;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:3px;\">תאריך<\u002Fspan><span style=\"font-size:1.02rem;color:#fff;\">יום שישי, 3.7.2026 · 10:00 בבוקר<\u002Fspan><\u002Fdiv>\n        <div><span style=\"display:block;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:3px;\">משך<\u002Fspan><span style=\"font-size:1.02rem;color:#fff;\">שעתיים<\u002Fspan><\u002Fdiv>\n        <div><span style=\"display:block;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:3px;\">קבוצה<\u002Fspan><span style=\"font-size:1.02rem;color:#fff;\">קטנה ואינטימית · עד 8 משתתפים<\u002Fspan><\u002Fdiv>\n        <div><span style=\"display:block;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:3px;\">מחיר<\u002Fspan><span style=\"font-size:1.02rem;color:#fff;\">270 ₪ <s style=\"opacity:0.5;font-size:0.85em;\">350 ₪<\u002Fs><\u002Fspan><\u002Fdiv>\n        <div><span style=\"display:block;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:3px;\">פורמט<\u002Fspan><span style=\"font-size:1.02rem;color:#fff;\">חוויה קבוצתית עם הנחיה אישית<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"https://wa.me/972559930227?text=נשימה\" target=\"_blank\" rel=\"noopener\" aria-label=\"שלח הודעת וואטסאפ עם המילה נשימה לפרטים\" style=\"display:inline-flex;align-items:center;gap:10px;background:var(--wa);color:#fff;padding:14px 26px;border-radius:999px;text-decoration:none;font-size:15px;font-weight:600;box-shadow:0 10px 26px rgba(37,211,102,0.28);transition:transform .15s;\" style-hover=\"transform:translateY(-2px)\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z\"><\u002Fpath><path d=\"M12 0C5.373 0 0 5.373 0 12c0 2.091.537 4.06 1.476 5.778L.057 23.25l5.616-1.473A11.953 11.953 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.808 9.808 0 01-5.002-1.368l-.359-.213-3.73.977.996-3.638-.234-.374A9.815 9.815 0 012.182 12C2.182 6.59 6.59 2.18 ;bgTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Cream&quot;,&quot;Mist&quot;,&quot;Sand&quot;],&quot;default&quot;:&quot;Cream&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { panelOpen:false, privacyOpen:false, a11yOpen:false, hc:false, large:false, dys:false };\n\n  applyTheme(){\n    const a = this.props.accent || 'Sage';\n    const b = this.props.bgTone || 'Cream';\n    const accent = {Sage:'#4E8478', Ocean:'#2F7D8C', Clay:'#A9774F'}[a] || '#4E8478';\n    const pale   = {Sage:'#DDE7E1', Ocean:'#D6E6EA', Clay:'#EBE0D3'}[a] || '#DDE7E1';\n    const tone   = {Cream:['#F6F2EA','#ECE7DB'], Mist:['#EEF1EE','#E1E8E2'], Sand:['#F4EDE2','#E9E0CE']}[b] || ['#F6F2EA','#ECE7DB'];\n    const r = document.documentElement.style;\n    r.setProperty('--teal', accent);\n    r.setProperty('--teal-pale', pale);\n    r.setProperty('--bg', tone[0]);\n    r.setProperty('--surface-soft', tone[1]);\n  }\n\n  componentDidMount(){\n    this.applyTheme();\n    const next = {};\n    [['high-contrast','hc'],['large-text','large'],['dyslexia-font','dys']].forEach(([cls,key])=>{\n      if (localStorage.getItem('a11y_'+cls) === 'true'){ document.body.classList.add(cls); next[key]=true; }\n    });\n    if (Object.keys(next).length) this.setState(next);\n    this._key = (e)=>{ if (e.key === 'Escape') this.setState({ panelOpen:false, privacyOpen:false, a11yOpen:false }); };\n    this._click = (e)=>{\n      if (!this.state.panelOpen) return;\n      const panel = document.getElementById('a11y-panel');\n      const tgt = e.target;\n      if (panel && !panel.contains(tgt) && !(tgt.closest && tgt.closest('[aria-controls=\"a11y-panel\"]'))){\n        this.setState({ panelOpen:false });\n      }\n    };\n    document.addEventListener('keydown', this._key);\n    document.addEventListener('click', this._click);\n  }\n\n  componentDidUpdate(prev){\n    if (prev.accent !== this.props.accent || prev.bgTone !== this.props.bgTone) this.applyTheme();\n  }\n\n  componentWillUnmount(){\n    document.removeEventListener('keydown', this._key);\n    document.removeEventListener('click', this._click);\n  }\n\n  toggleMode(cls, key){\n    const on = !document.body.classList.contains(cls);\n    document.body.classList.toggle(cls, on);\n    localStorage.setItem('a11y_'+cls, on);\n    this.setState({ [key]: on });\n  }\n\n  resetModes(){\n    [['high-contrast','hc'],['large-text','large'],['dyslexia-font','dys']].forEach(([cls,key])=>{\n      document.body.classList.remove(cls);\n      localStorage.removeItem('a11y_'+cls);\n    });\n    this.setState({ hc:false, large:false, dys:false });\n  }\n\n  renderVals(){\n    return {\n      panelOpen: this.state.panelOpen,\n      privacyOpen: this.state.privacyOpen,\n      a11yOpen: this.state.a11yOpen,\n      modeHC: this.state.hc,\n      modeLarge: this.state.large,\n      modeDys: this.state.dys,\n      togglePanel: ()=> this.setState(s=>({ panelOpen: !s.panelOpen })),\n      toggleHC: ()=> this.toggleMode('high-contrast','hc'),\n      toggleLarge: ()=> this.toggleMode('large-text','large'),\n      toggleDys: ()=> this.toggleMode('dyslexia-font','dys'),\n      resetModes: ()=> this.resetModes(),\n      openPrivacy: ()=> this.setState({ privacyOpen:true }),\n      closePrivacy: ()=> this.setState({ privacyOpen:false }),\n      openA11y: ()=> this.setState({ a11yOpen:true }),\n      closeA11y: ()=> this.setState({ a11yOpen:false }),\n      stop: (e)=> e.stopPropagation(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
