<!DOCTYPE html>

<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #111a1a; z-index: 9999; }

    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.

</head>
<body>
  <div id="__bundler_thumbnail">
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="800" fill="#111a1a"></rect>
<text x="600" y="440" font-size="220" text-anchor="middle" fill="#88b8a8" font-family="sans-serif">🎬</text>
</svg>
</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Trauma-informed welcome screen: establish choice, pacing, and readiness
    // before asking the participant to approach a difficult memory.
    const introStart = template.indexOf('<section class="screen" id="s-intro"');
    const introEnd = template.indexOf('<section class="screen" id="s-connect"', introStart);
    if (introStart !== -1 && introEnd !== -1) {
      const safeIntro = `
    <section class="screen" id="s-intro" data-screen-label="הכנה" style="display:flex;flex-direction:column;gap:1rem;align-items:center;width:100%" aria-labelledby="intro-title">
      <div style="width:100%;padding:.35rem .1rem;text-align:center">
        <div style="display:inline-flex;align-items:center;gap:.45rem;padding:.4rem .8rem;border:1px solid rgba(126,224,195,.28);border-radius:99px;background:rgba(126,224,195,.08);color:var(--ta-calm);font-size:.82rem;font-weight:650;margin-bottom:.8rem">
          <span aria-hidden="true">◉</span><span>צעד ראשון · יוצרים מרחק בטוח</span>
        </div>
        <h1 id="intro-title" style="font-size:clamp(1.55rem,5vw,2.15rem);line-height:1.25;margin:0 0 .65rem;color:var(--ta-ink-100);letter-spacing:-.02em">לפני שנתקרב לזיכרון,<br>נוודא שיש לך שליטה מלאה בתהליך</h1>
        <p style="font-size:1rem;line-height:1.75;color:var(--ta-ink-300);max-width:610px;margin:0 auto">
          בתרגול נתבונן בזיכרון בהדרגה וממרחק, באמצעות דימוי של אולם קולנוע. אין צורך לספר את כל מה שקרה או להיכנס לפרטים שאינך רוצה לפגוש כרגע.
        </p>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:.7rem;width:100%" role="list" aria-label="עקרונות הביטחון בתהליך">
        <div role="listitem" style="padding:1rem;border:1px solid rgba(255,255,255,.1);border-radius:var(--ta-radius-sm);background:rgba(255,255,255,.045)">
          <div aria-hidden="true" style="font-size:1.25rem;margin-bottom:.35rem">⏸</div><strong style="display:block;margin-bottom:.25rem">אתה קובע את הקצב</strong><span style="font-size:.88rem;line-height:1.55;color:var(--ta-ink-400)">אפשר לעצור, לחזור אחורה או לצאת בכל רגע.</span>
        </div>
        <div role="listitem" style="padding:1rem;border:1px solid rgba(255,255,255,.1);border-radius:var(--ta-radius-sm);background:rgba(255,255,255,.045)">
          <div aria-hidden="true" style="font-size:1.25rem;margin-bottom:.35rem">↔</div><strong style="display:block;margin-bottom:.25rem">מתחילים במרחק</strong><span style="font-size:.88rem;line-height:1.55;color:var(--ta-ink-400)">קודם ניצור עוגן ביטחון ונלמד להתבונן מבחוץ.</span>
        </div>
        <div role="listitem" style="padding:1rem;border:1px solid rgba(255,255,255,.1);border-radius:var(--ta-radius-sm);background:rgba(255,255,255,.045)">
          <div aria-hidden="true" style="font-size:1.25rem;margin-bottom:.35rem">⌂</div><strong style="display:block;margin-bottom:.25rem">המידע נשאר אצלך</strong><span style="font-size:.88rem;line-height:1.55;color:var(--ta-ink-400)">התשובות והתמונות נשמרות רק במכשיר שלך.</span>
        </div>
      </div>

      <fieldset id="readinessCheck" style="width:100%;border:1px solid rgba(111,183,255,.22);border-radius:var(--ta-radius-md);background:linear-gradient(145deg,rgba(111,183,255,.08),rgba(126,224,195,.035));padding:1rem 1.1rem;margin:0">
        <legend style="padding:0 .45rem;font-size:1.05rem;font-weight:700;color:var(--ta-ink-100)">רגע לפני שמתחילים</legend>
        <div style="display:flex;flex-direction:column;gap:.7rem;margin-top:.2rem">
          <label style="display:flex;align-items:flex-start;gap:.7rem;cursor:pointer;line-height:1.5"><input class="ready-check" type="checkbox" style="width:1.25rem;height:1.25rem;flex:0 0 auto;margin-top:.08rem;accent-color:var(--ta-calm)"><span>אני נמצא כרגע במקום שקט ובטוח.</span></label>
          <label style="display:flex;align-items:flex-start;gap:.7rem;cursor:pointer;line-height:1.5"><input class="ready-check" type="checkbox" style="width:1.25rem;height:1.25rem;flex:0 0 auto;margin-top:.08rem;accent-color:var(--ta-calm)"><span>יש לי כ־15 דקות, ואינני נוהג או מבצע משימה אחרת.</span></label>
          <label style="display:flex;align-items:flex-start;gap:.7rem;cursor:pointer;line-height:1.5"><input class="ready-check" type="checkbox" style="width:1.25rem;height:1.25rem;flex:0 0 auto;margin-top:.08rem;accent-color:var(--ta-calm)"><span>בחרתי זיכרון שאני מסוגל לחשוב עליו כרגע בלי להרגיש שאני מאבד שליטה.</span></label>
        </div>
      </fieldset>

      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.7rem;width:100%">
        <button id="btnStart" disabled aria-describedby="startHint" style="min-height:52px;padding:.85rem 1.7rem;border-radius:99px;font-weight:700;font-size:1rem;background:linear-gradient(135deg,var(--ta-calm),#62c9ae);color:#07111e;box-shadow:0 8px 24px -8px rgba(126,224,195,.45);border:none;cursor:pointer;font-family:inherit;transition:transform .2s,opacity .2s;opacity:.42">אני מוכן להתחיל בהדרגה</button>
        <button id="btnNotNow" type="button" style="min-height:52px;padding:.85rem 1.35rem;border-radius:99px;font-weight:600;font-size:1rem;background:transparent;color:var(--ta-ink-300);border:1px solid rgba(255,255,255,.18);cursor:pointer;font-family:inherit">לא מתאים לי עכשיו</button>
      </div>
      <p id="startHint" aria-live="polite" style="font-size:.82rem;color:var(--ta-ink-400);text-align:center;margin:-.35rem 0 0">כדי להתחיל, יש לאשר את שלושת הסעיפים.</p>

      <aside role="note" style="width:100%;font-size:.84rem;line-height:1.65;color:var(--ta-ink-400);border-right:3px solid rgba(255,209,102,.7);background:rgba(255,209,102,.055);padding:.8rem .95rem;border-radius:10px">
        <strong style="color:#f1d58a">חשוב לדעת:</strong> אם הזיכרון מעורר כרגע הצפה חזקה, ניתוק, בלבול או תחושה שאינך בטוח, אל תמשיך לבד. עצור ופנה לאיש מקצוע או לאדם תומך. התרגול אינו תחליף לטיפול מקצועי.
      </aside>

      <script>
        (function(){
          const checks = Array.from(document.querySelectorAll('#readinessCheck .ready-check'));
          const start = document.getElementById('btnStart');
          const hint = document.getElementById('startHint');
          const update = function(){
            const ready = checks.length === 3 && checks.every(function(c){ return c.checked; });
            start.disabled = !ready;
            start.style.opacity = ready ? '1' : '.42';
            start.style.cursor = ready ? 'pointer' : 'not-allowed';
            hint.textContent = ready ? 'אפשר להתחיל. גם בהמשך תוכל לעצור בכל רגע.' : 'כדי להתחיל, יש לאשר את שלושת הסעיפים.';
          };
          checks.forEach(function(c){ c.addEventListener('change', update); });
          document.getElementById('btnNotNow').addEventListener('click', function(){
            hint.textContent = 'זה בסדר לעצור כאן. אפשר לחזור לתרגול בזמן שירגיש מתאים יותר.';
            document.getElementById('readinessCheck').scrollIntoView({behavior:'smooth', block:'center'});
          });
          update();
        })();
      <\/script>
    </section>

    `;
      template = template.slice(0, introStart) + safeIntro + template.slice(introEnd);
    }

    // Softer trauma-informed palette: warm charcoal, sage, cream, and sand.
    // Keep the cinema depth while reducing the cold, technical blue cast.
    const traumaPalette = {
      '#0d1420':'#111a1a',
      '#142033':'#182724',
      '#16202f':'#1b2928',
      '#1d2a3d':'#243533',
      '#f2f6fb':'#f1eee7',
      '#cdd9e8':'#d8ddd8',
      '#a7bcd2':'#b8c3be',
      '#6fb7ff':'#88b8a8',
      '#4a8fd6':'#729a91',
      '#7ee0c3':'#9bc7b1',
      '#ffd166':'#d8b77a',
      '#ff9eb3':'#c9a6a6',
      '#ff8080':'#c99276',
      '#07111e':'#0d1715',
      'rgba(111,183,255':'rgba(136,184,168',
      'rgba(126,224,195':'rgba(155,199,177',
      'rgba(255,209,102':'rgba(216,183,122',
      'rgba(167,188,210':'rgba(184,195,190'

    for (const [from, to] of Object.entries(traumaPalette)) {
      template = template.split(from).join(to);
    }

    const comfortStyles = `<style>

        background:
          radial-gradient(72% 58% at 50% 24%, rgba(155,199,177,.11) 0%, rgba(155,199,177,.035) 42%, transparent 72%),

        margin-bottom:.4rem !important;

        padding:.78rem .82rem !important;
        background:linear-gradient(145deg,rgba(241,238,231,.075),rgba(216,183,122,.035)) !important;
        border-color:rgba(216,183,122,.16) !important;
        box-shadow:0 10px 30px rgba(5,12,11,.12);
      }
      #s-intro [role="list"] > [role="listitem"] > div { margin-bottom:.18rem !important; color:#d8b77a; }

ms:center;font-size:1.15rem;border:1px solid rgba(255,255,255,.08);cursor:pointer;color:inherit;transition:background .26s\" style-hover=\"background:rgba(255,255,255,.14)\">⛶<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"padding:0 1.1rem .4rem\">\n    <div role=\"progressbar\" aria-label=\"התקדמות בתהליך\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"0\" id=\"pbarWrap\" style=\"height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden\">\n      <i id=\"pbar\" style=\"display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--ta-calm),var(--ta-accent));border-radius:99px;transition:width .55s cubic-bezier(.22,.9,.3,1)\"><\u002Fi>\n    <\u002Fdiv>\n    <div id=\"stepname\" style=\"font-size:.8rem;color:var(--ta-ink-400);margin-top:.35rem;text-align:center;min-height:1.2em\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <main id=\"stage\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:.6rem 1.1rem 1rem;width:100%;max-width:720px;margin:0 auto;box-sizing:border-box\">\n\n    <section class=\"screen\" id=\"s-intro\" data-screen-label=\"מבוא\" style=\"display:flex;flex-direction:column;gap:1.1rem;align-items:center;width:100%\">\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:var(--ta-radius-md);padding:1.1rem 1.3rem;width:100%;font-size:1.08rem;color:var(--ta-ink-100);text-align:center;box-sizing:border-box\">\n        <strong>ברוך הבא לתהליך עיבוד זיכרון רגשי<\u002Fstrong><br>\n        חוויה מודרכת בת כ-15 דקות, המבוססת על טכניקת הקולנוע (דיסוציאציה מובנית).\n        תיצור תמונות, תצפה בהן ממרחק בטוח, ותשנה את הדרך שבה הזיכרון מקודד.\n        <small style=\"display:block;margin-top:.5rem;color:var(--ta-ink-400);font-size:.85rem\">מומלץ: מקום שקט, אוזניות, ומסך מלא.<\u002Fsmall>\n      <\u002Fdiv>\n      <ul style=\"display:flex;flex-direction:column;gap:.55rem;font-size:1rem;list-style:none;margin:0;padding:0;width:100%\">\n        <li style=\"display:flex;align-items:center;gap:.6rem\"><span style=\"color:var(--ta-calm);font-weight:700\">✓<\u002Fspan> אתה שולט בקצב — אפשר לחזור אחורה בכל שלב<\u002Fli>\n        <li style=\"display:flex;align-items:center;gap:.6rem\"><span style=\"color:var(--ta-calm);font-weight:700\">✓<\u002Fspan> העבודה נשמרת רק במכשיר שלך<\u002Fli>\n        <li style=\"display:flex;align-items:center;gap:.6rem\"><span style=\"color:var(--ta-calm);font-weight:700\">✓<\u002Fspan> בכל רגע אפשר לעצור ולהפעיל את עוגן הביטחון<\u002Fli>\n      <\u002Ful>\n      <button id=\"btnStart\" style=\"padding:.85rem 2rem;border-radius:99px;font-weight:600;font-size:1.05rem;background:linear-gradient(135deg,var(--ta-accent),#4a8fd6);color:#07111e;box-shadow:0 8px 24px -8px rgba(111,183,255,.5);border:none;cursor:pointer;font-family:inherit;transition:transform .26s\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:scale(.97)\">התחל תהליך<\u002Fbutton>\n      <p style=\"font-size:.85rem;color:var(--ta-ink-400);text-align:center;max-width:460px;border-top:1px solid rgba(255,255,255,.08);padding-top:.8rem;margin:0\">\n        כלי זה הוא תרגול עצמי מודרך ואינו תחליף לטיפול מקצועי. אם מדובר בטראומה קשה או שאתה חש הצפה —\n        עצור ופנה לאיש מקצוע. שים לב: התהליך כולל הבזקי מסך ואפקטים מהירים.\n      <\u002Fp>\n    <\u002Fsection>\n\n    <section class=\"screen\" id=\"s-connect\" data-screen-label=\"שלב 1\" data-name=\"שלב 1 · חיבור לאירוע\" data-voice=\"היזכר באירוע לא נעים. אינך צריך להיכנס אליו לעומק — רק לדעת לאיזה זיכרון אתה מתכוון.\" style=\"display:none;width:100%\">\n      <div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:var(--ta-radius-md);padding:1.1rem 1.3rem;width:100%;font-size:1.08rem;color:var(--ta-ink-100);text-align:center;box-sizing:border-box\">\n        היזכר באירוע לא נעים…<br>\n        אין צורך לצלול פנימה — מספיק לדעת <em>לאיזה<\u002Fem> זיכרון אתה מתכוון.\n        <small style=\"display:block;margin-top:.5rem;color:var(--ta-ink-400);font-size:.85rem\">אפשר (לא חובה) לכתוב לו כותרת קצרה — רק בשבילך.<\u002Fsmall>\n      <\u002Fdiv>\n      <textarea id=\"eventDesc\" placeholder=\"כותרת קצרה לאירוע (אופציונלי)…\" rows=\"2\" maxlength=\"120\" aria-label=\"כותרת קצרה לאירוע\" style=\"width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:var(--ta-radius-sm);padding:.8rem 1rem;resize:vertical;min-height:70px;color:var(--ta-ink-100);font-family:inherit;font-size:1rem;box-sizing:border-box\"><\u002Ftextarea>\n      <button data-next=\"\" style=\"padding:.85rem 2rem;border-radius:99px;font-weight:600;font-size:1.05rem;background:linear-gradient(135deg,var(--ta-accent),#4a8fd6);color:#07111e;box-shadow:0 8px 24px -8px rgba(111,183,255,.5);border:none;cursor:pointer;font-family:inherit;transition:transform .26s\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:scale(.97)\">אני מחובר לאירוע<\u002Fbutton>\n    <\u002Fsection>\n\n    <section class=\"screen\" id=\"s-rate-before\" data-screen-label=\"שלב 2\" data-name=\"שלב 2 · זיהוי רגש\" data-voice=\"כשאתה חושב על האירוע — כמה חזק הרגש עכשיו, בין אחת לעשר?\" style=\"display:none;width:100%\">\n      <div aria-live=\"polite\" style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:var(--ta-radius-md);padding:1.1rem 1.3rem;width:100%;font-size:1.08rem;color:var(--ta-ink-100);text-align:center;box-sizing:border-box\">כשאתה חושב על האירוע עכשיו —<br>מה עוצמת הרגש שעולה?<\u002Fdiv>\n      <div dir=\"ltr\" style=\"width:100%;display:flex;flex-direction:column;align-items:center;gap:.6rem\">\n        <div id=\"numBefore\" aria-live=\"polite\" style=\"font-size:3.6rem;font-weight:700;line-height:1;background:linear-gradient(135deg,var(--ta-accent-2),var(--ta-rose));-webkit-background-clip:text;background-clip:text;color:transparent\">5<\u002Fdiv>\n        <div style=\"position:relative;width:100%;max-wid rem;width:100%;font-size:1.08rem;color:var(--ta-ink-100);text-align:center;box-sizing:border-box\">ניצור <strong>עוגן ביטחון<\u002Fstrong>.<br>נשום בקצב העיגול, והיזכר ברגע שבו הרגשת בטוח לגמרי.<\u002Fdiv>\n      <div aria-hidden=\"true\" style=\"width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%, rgba(126,224,195,.9), rgba(111,183,255,.35));box-shadow:0 0 60px rgba(126,224,195,.35);animation:ta-breathe 8s ease-in-out infinite;display:grid;place-items:center;font-size:.85rem;color:#06281e;font-weight:600\">נשימה<\u002Fdiv>\n      <div style=\"color:var(--ta-ink-400);font-size:.88rem;text-align:center\">איפה בגוף אתה מרגיש את הביטחון? לחץ על האזור:<\u002Fdiv>\n      <div style=\"position:relative;display:flex;justify-content:center\">\n        <svg sc-camel-view-box=\"0 0 100 210\" aria-label=\"דמות גוף לבחירת מיקום העוגן\" style=\"width:150px;height:auto\">\n          <circle class=\"bodyzone\" data-zone=\"ראש\" cx=\"50\" cy=\"22\" r=\"16\" style=\"fill:rgba(255,255,255,.10);stroke:rgba(255,255,255,.25);stroke-width:1.5;cursor:pointer\"><\u002Fcircle>\n          <rect class=\"bodyzone\" data-zone=\"חזה\" x=\"32\" y=\"42\" width=\"36\" height=\"34\" rx=\"10\" style=\"fill:rgba(255,255,255,.10);stroke:rgba(255,255,255,.25);stroke-width:1.5;cursor:pointer\"><\u002Frect>\n          <rect class=\"bodyzone\" data-zone=\"בטן\" x=\"34\" y=\"80\" width=\"32\" height=\"28\" rx=\"10\" style=\"fill:rgba(255,255,255,.10);stroke:rgba(255,255,255,.25);stroke-width:1.5;cursor:pointer\"><\u002Frect>\n          <rect class=\"bodyzone\" data-zone=\"יד ימין\" x=\"10\" y=\"46\" width=\"16\" height=\"52\" rx=\"8\" style=\"fill:rgba(255,255,255,.10);stroke:rgba(255,255,255,.25);stroke-width:1.5;cursor:pointer\"><\u002Frect>\n          <rect class=\"bodyzone\" data-zone=\"יד שמאל\" x=\"74\" y=\"46\" width=\"16\" height=\"52\" rx=\"8\" style=\"fill:rgba(255,255,255,.10);stroke:rgba(255,255,255,.25);stroke-width:1.5;cursor:pointer\"><\u002Frect>\n ;\n        $$(\"#s-anchor2 .bodyzone\").forEach(z=>{\n          const sel = z.dataset.zone === state.anchor.zone;\n          z.style.fill = sel ? \"rgba(255,209,102,.55)\" : \"rgba(255,255,255,.10)\";\n          z.style.stroke = sel ? \"#ffd166\" : \"rgba(255,255,255,.25)\";\n          z.style.strokeWidth = sel ? \"2.5\" : \"1.5\";\n        });\n      },\n      \"s-forward\": ()=>{\n        buildSeats($(\"#seats2\"));\n        setStill(\"#fwd1\", state.image1);\n        setStill(\"#fwd2\", null);\n        requestAnimationFrame(()=>drawSightLines(\"#fwdScene\"));\n        if(state.fwdLoops === 0){\n          setDisabled($(\"#btnPlayFwd\"), false);\n          $(\"#btnPlayFwd\").textContent = \"▶ הרץ קדימה\";\n        }\n      },\n      \"s-enter\": ()=>{\n        const scene = $$('#s-enter div[style*=\"linear-gradient(180deg,#233046\"]')[0];\n        if(scene) scene.style.animation = \"\";\n      },\n      \"s-reverse\": ()=>{\n        setStill(\"#rev2\", state.image2);\n        setStill(\"#rev1\", null);\n        prepareReverseScreen(state.revRounds > 0);\n      },\n      \"s-summary\": ()=>{\n        const b = state.intensityBefore, a = state.intensityAfter ?? b;\n        $(\"#sumBefore\").textContent = b;\n        $(\"#sumAfter\").textContent = a;\n        requestAnimationFrame(()=>{\n          $(\"#barBefore\").style.height = (b*10)+\"%\";\n          $(\"#barAfter\").style.height = (a*10)+\"%\";\n        });\n        const drop = b - a;\n        $(\"#sumSub\").textContent = drop > 0\n          ? `העוצמה ירדה ב-${drop} נקודות (${b} ← ${a})`\n          : \"השלמת את כל שלבי התהליך\";\n        const mins = Math.max(1, Math.round((Date.now()-state.startTime)/60000));\n        $(\"#sumStats\").textContent =\n          `⏱ משך: כ-${mins} דק׳ · ▶ הרצות קדימה: ${state.fwdLoops} · ⏪ הרצות אחורה: ${state.revLoops}`;\n        $(\"#btnMoreRound\").hidden = !(a > state.targetIntensity);\n      },\n    };\n\n    $(\"#btnMoreRound\").addEventListener(\"click\", ()=>{\n      prepareReverseScreen(true);\n      show(\"s-reverse\", {back:true});\n    });\n    $(\"#btnRestart\").addEventListener(\"click\", ()=>location.reload());\n\n    $(\"#eventDesc\").addEventListener(\"input\", e=>state.eventDesc = e.target.value);\n\n    show(\"s-intro\");\n    updateRemote();\n  }\n\n  renderVals(){ return {}; }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
