<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מודעה — כשהגל עולה</title><style>body{margin:0;background:#dfe6df;display:grid;place-items:center;min-height:100vh;font-family:Arial,sans-serif;color:#25342e}.ad{width:min(92vw,1080px);aspect-ratio:1/1;background:linear-gradient(145deg,#f7f1e7,#e2e9e1);position:relative;overflow:hidden;border-radius:36px;box-shadow:0 30px 80px #26382f25}.circle{position:absolute;width:55%;height:55%;border:1px solid #9fb2a7;border-radius:50%;left:-12%;top:-8%}.circle:after{content:'';position:absolute;inset:12%;border:1px solid #b9c7bf;border-radius:50%}.copy{position:absolute;right:8%;top:11%;width:72%}.tag{font-size:clamp(14px,2vw,23px);font-weight:700;color:#8a654f}.copy h1{font-size:clamp(42px,7vw,88px);line-height:1.04;margin:25px 0}.copy p{font-size:clamp(18px,2.4vw,31px);max-width:720px}.pill{display:inline-block;background:#48675b;color:white;padding:15px 24px;border-radius:100px;font-weight:700;font-size:clamp(15px,2vw,23px)}.brand{position:absolute;bottom:6%;right:8%;font-weight:700}.wave{position:absolute;bottom:-10%;left:-5%;width:70%;height:33%;border-radius:50% 50% 0 0;background:#b8c9bd55;transform:rotate(-7deg)}</style><body><div class="ad"><div class="circle"></div><div class="wave"></div><div class="copy"><div class="tag">מדריך חינמי • 5 שלבים</div><h1>כשהחרדה עולה,<br>לא צריך <span style="color:#567568">להילחם בה.</span></h1><p>צריך ללמוד להוביל את עצמנו בתוכה.</p><div class="pill">לקבלת המדריך ללא עלות ←</div></div><div class="brand">דוד אינגבר | חוזרים לסמוך על עצמנו</div></div></body></html>
